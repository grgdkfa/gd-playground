<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>warc2tiles</title>

	<style>
	    body {
					margin: 0;
					padding: 0;
					font-family: 'Arial';
		}

		.wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
		}

    .info {
      position: fixed;
      top: 0;
      left: 50%;
      background-color: white;
      padding: 0.1em 0.5em;
      z-index: 99999;
    }

    .panel {
      display: flex;
      gap: 2em;
      margin-top: 2em;
    }

    .tiles {
      position: relative;
    }

		.tiles img {
		    border: 1px solid red;
		}

    .sample {
      position: relative;
    }

    .dot {
      position: absolute;
      width: 32px;
      height: 32px;
      border: 1px solid red;
      box-sizing: border-box;
      color: red;
      text-align: center;
      cursor: pointer;
    }

    .dot.hidden {
      opacity: 0.1;
      background-color: rgba(255, 255, 255, 0.01);
    }
	</style>
</head>
<body>
    <div class="wrapper">
        <div class="info"></div>
      <div class="panel">
        <div class="tiles">
            <img src="tiles.png"/>
            <div class="dot hidden" style="top: 0px; left: 0px;"></div>
        </div>
        <div class="sample">
          <img src="grab.png"/>
        </div>
        <div class="data">
          <img src="forest.png"/>
        </div>
      </div>
    </div>

    <script>
    const terrains = {
      'walls-human': {
        start: 16, end: 33
      },
      'walls-orc': {
        start: 34, end: 51
      },
      'walls-human-damaged': {
        start: 52, end: 69
      },
      'walls-orc-damaged': {
        start: 70, end: 87
      },
      'walls-ruins': {
        start: 88, end: 101
      },
      'grass': {
        start: 356, end: 363
      },
      'grass-dark': {
        start: 364, end: 371
      },
      'dirt': {
        start: 334, end: 344
      },
      'dirt-dark': {
        start: 345, end: 355
      },
      'woods': {
        start: 102, end: 141
      }
    }


    var info = document.querySelector('.info');
    var tilesContainer = document.querySelector('.tiles')
    var tilesImage = tilesContainer.querySelector('img')
    var sampleContainer = document.querySelector('.sample')
    var sampleImage = document.querySelector('.sample img')
    var dataContainer = document.querySelector('.data')
    var dataImage = document.querySelector('.data img')
    var tileDot = tilesContainer.querySelector('.dot')

    let currentTile = null

    tilesImage.addEventListener('mousemove', e => {
      const tx = e.offsetX / 33 | 0
      const ty = e.offsetY / 33 | 0
      const i = ty * 19 + tx
      if (currentTile !== i) {
        let t = sampleContainer.querySelectorAll(`.dot`)
        t.forEach(d => d.classList.add('hidden'))
        currentTile = i
        t = sampleContainer.querySelectorAll(`.dot[data-tile="${i}"]`)
        t.forEach(d => d.classList.remove('hidden'))
      }
      info.textContent = `${tx} : ${ty} (${i})`;
    })

    tilesImage.addEventListener('mouseout', e => {
      info.textContent = '---'
    })

    function getTile(tx, ty) {
      return [tx * 33, ty * 33]
    }

    </script>
    <script src="./pipa.js"></script>
</body>
</html>
